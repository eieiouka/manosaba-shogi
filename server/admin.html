<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔法将棋・対局履歴</title>
<style>*{box-sizing:border-box}body{margin:0;background:#121316;color:#ececf0;font:15px system-ui,sans-serif}main{max-width:1100px;margin:40px auto;padding:0 20px}h1{font-size:26px;margin-bottom:6px}.muted{color:#aaa}input,button{font:inherit;border:1px solid #444;border-radius:8px;padding:10px 14px;background:#22252c;color:inherit}button{cursor:pointer}button:hover{border-color:#dbac65}form,.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.card{padding:18px;border:1px solid #34363e;border-radius:12px}.card strong{display:block;font-size:27px;margin-top:8px}.scroll{overflow:auto;margin:20px 0}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:13px;border-bottom:1px solid #353740}th{font-size:13px;color:#aaa}#error{color:#ffc281;white-space:pre-wrap}dialog{width:min(900px,94vw);max-height:85vh;background:#1b1d23;color:inherit;border:1px solid #555;border-radius:14px;padding:24px}dialog::backdrop{background:#0009}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}#detailMeta{white-space:pre-wrap;line-height:1.7}#login{max-width:430px}#login input{width:100%}[hidden]{display:none!important}</style>
<main><div class="top"><div><h1>魔法少女ノ魔法将棋</h1><span class="muted">管理者用 · オンライン対局履歴</span></div><button id="logout" hidden>ログアウト</button></div>
<form id="login"><label for="password">管理者パスワード</label><input id="password" type="password" autocomplete="current-password" required><button>履歴を見る</button></form><p id="error" role="alert"></p>
<section id="dashboard" hidden><div id="cards" class="cards"></div><form id="search"><input id="query" placeholder="ニックネームで検索" aria-label="ニックネーム検索"><button>検索</button><button type="button" id="refresh">更新</button></form><div class="scroll"><table><thead><tr><th>開始日時（日本時間）</th><th>先手</th><th>後手</th><th>結果</th><th>手数</th><th>時間</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="toolbar"><button id="prev">前へ</button><span id="page"></span><button id="next">次へ</button></div><p class="muted">ニックネームは自己申告です。同じ名前でも同一人物とは限りません。AI戦と追加前の対局は集計されません。</p></section></main>
<dialog id="details"><div class="top"><h2>対局の詳細</h2><button id="closeDetail">閉じる</button></div><p id="detailMeta"></p><div class="scroll"><table><thead><tr><th>手数</th><th>対戦者</th><th>指し手</th><th>日時</th></tr></thead><tbody id="moves"></tbody></table></div></dialog>
<script>
let password='',offset=0,total=0;const $=id=>document.getElementById(id);const reasons={'resign':'投了','timeout':'時間切れ','disconnected':'切断','repetition':'千日手','checkmate':'詰み','no-legal-move':'合法手なし','ema-safe-try':'トライ'};const pieces={ema:'エマ',nanoka:'ナノカ',hiro:'ヒロ',sherry:'シェリー',hanna:'ハンナ',margo:'マーゴ'};
const date=t=>t?new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',dateStyle:'short',timeStyle:'medium'}).format(t):'—';
const result=r=>r.result?(r.result.winner===null?'引き分け':r.nicknames[r.result.winner]+' 勝ち')+' / '+(reasons[r.result.reason]||r.result.reason):r.status;
const square=p=>p?String.fromCharCode(97+p[1])+(6-p[0]):'—';
function action(a){return (a.category==='drop'?(pieces[a.piece?.type]||a.piece?.type||'駒')+' 打ち':square(a.from))+' → '+square(a.to)+(a.magic?' / '+a.magic:'')+(a.swap?' / 入替':'')+(a.promote?' / 魔女化':'')}
async function api(path){const r=await fetch(path,{headers:{Authorization:'Bearer '+password},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'取得できません');return d}
function cell(tr,value){const td=document.createElement('td');td.textContent=value;tr.append(td);return td}
async function detail(id){try{const r=await api('/admin/match?id='+encodeURIComponent(id));$('detailMeta').textContent=date(r.startedAt)+'\n先手：'+r.nicknames.sente+' / 後手：'+r.nicknames.gote+'\n'+result(r)+'\n終了：'+date(r.finishedAt);$('moves').replaceChildren();r.moves.forEach((m,i)=>{const tr=document.createElement('tr');cell(tr,i+1);cell(tr,r.nicknames[m.side]);cell(tr,action(m.action));cell(tr,date(m.at));$('moves').append(tr)});$('details').showModal()}catch(e){$('error').textContent=e.message}}
async function load(){try{$('error').textContent='';const d=await api('/admin/matches?offset='+offset+'&q='+encodeURIComponent($('query').value));total=d.total;$('dashboard').hidden=false;$('login').hidden=true;$('logout').hidden=false;$('cards').replaceChildren();for(const [label,n]of [['累計対局',d.summary.total],['今日の対局',d.summary.today],['終了した対局',d.summary.completed],['現在の対局',d.summary.active],['待機人数',d.summary.waiting]]){const el=document.createElement('div');el.className='card';el.textContent=label;const value=document.createElement('strong');value.textContent=n;el.append(value);$('cards').append(el)}if(d.summary.storageError)$('error').textContent='履歴の保存に失敗しています。サーバーの保存先を確認してください。';$('rows').replaceChildren();for(const r of d.items){const tr=document.createElement('tr');cell(tr,date(r.startedAt));cell(tr,r.nicknames.sente);cell(tr,r.nicknames.gote);cell(tr,result(r));cell(tr,r.moveCount);cell(tr,r.finishedAt?Math.round((r.finishedAt-r.startedAt)/1000)+'秒':'—');const td=cell(tr,'');const b=document.createElement('button');b.textContent='詳細';b.onclick=()=>detail(r.id);td.append(b);$('rows').append(tr)}$('page').textContent=total?`${offset+1}–${Math.min(offset+50,total)} / ${total}件`:'履歴はまだありません';$('prev').disabled=offset===0;$('next').disabled=offset+50>=total}catch(e){$('error').textContent=e.message}}
$('login').onsubmit=e=>{e.preventDefault();password=$('password').value;$('password').value='';offset=0;load()};$('search').onsubmit=e=>{e.preventDefault();offset=0;load()};$('refresh').onclick=load;$('prev').onclick=()=>{offset=Math.max(0,offset-50);load()};$('next').onclick=()=>{offset+=50;load()};$('closeDetail').onclick=()=>$('details').close();$('logout').onclick=()=>{password='';$('dashboard').hidden=true;$('login').hidden=false;$('logout').hidden=true;$('rows').replaceChildren();$('cards').replaceChildren();$('moves').replaceChildren();$('detailMeta').textContent='';$('error').textContent='';$('details').close()};
</script></html>
