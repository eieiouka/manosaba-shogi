<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>まのさば将棋・19手目からの最善変化</title><style>body{font:16px system-ui;max-width:900px;margin:32px auto;padding:0 16px}input,button{font:inherit;padding:6px;margin:4px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ccc;text-align:right}td:nth-child(2){text-align:left}</style><h1>19手目からの最善変化</h1><p>19手目 c3c5（先手ナノカの銃撃）終了局面から、Fairy-Stockfishの最善候補を双方交互に追います。最初の後手候補が c6e4 か確認できます。</p><label>探索深度 <input id="depth" type="number" min="1" max="31" value="19"></label><label>各局面の最低探索時間(ms) <input id="budget" type="number" min="1" value="1000"></label><label>追跡する手数 <input id="count" type="number" min="1" max="60" value="20"></label><p><button id="start">解析開始</button><button id="stop" disabled>中止</button><button id="save" disabled>CSV保存</button></p><p id="status">待機中</p><p>評価値は先手視点。プラス＝魔の鯖有利、マイナス＝計画性のないナノカ有利。±20000は詰み・勝ち判定の可能性があり別途検証が必要。</p><table><thead><tr><th>局面（手目終了）</th><th>直前の着手</th><th>評価値</th><th>深度</th><th>ノード</th><th>次の最善手</th></tr></thead><tbody id="rows"></tbody></table><script type="module" src="/analyze-branch.js"></script></html>
