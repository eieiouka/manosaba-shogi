<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>まのさば将棋 局面検討</title><style>
:root{font-family:system-ui,"Yu Gothic",sans-serif;color:#222;background:#f4f5f8}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:1100px;margin:auto}h1{font-size:23px;margin:0 0 8px}.hint{color:#555;font-size:13px}.layout{display:grid;grid-template-columns:minmax(300px,550px) minmax(280px,1fr);gap:22px;margin-top:14px}.panel{background:white;border-radius:12px;padding:15px;box-shadow:0 2px 12px #0001}.board{display:grid;grid-template-columns:repeat(6,1fr);border:3px solid #56452f;aspect-ratio:1}.boardWrap{position:relative}.arrowOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}.cell{position:relative;border:1px solid #aa8d60;background:#f2dcae;aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:1px}.cell:nth-child(12n+7),.cell:nth-child(12n+9),.cell:nth-child(12n+11),.cell:nth-child(12n+2),.cell:nth-child(12n+4),.cell:nth-child(12n+6){background:#e9d09d}.cell.selected{background:#ffdf68!important}.cell.target:after{content:"";position:absolute;width:23%;height:23%;border-radius:50%;background:#309c69a8;pointer-events:none}.cell.last{box-shadow:inset 0 0 0 3px #4485b7}.piece{position:relative;z-index:1;width:80%;height:80%;border:2px solid #292929;background:#fff9ed;clip-path:polygon(50% 0%,95% 24%,88% 100%,12% 100%,5% 24%);display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:800;font-size:clamp(12px,2vw,21px)}.piece.gote{transform:rotate(180deg);background:#e2eaf5}.piece small{font-size:10px}.coord{position:absolute;bottom:2px;right:3px;font-size:10px;color:#735e40}.hand{display:flex;gap:6px;flex-wrap:wrap;min-height:45px;margin:6px 0}.hand button{padding:5px 8px}.hand button.active{background:#ffe28a}.bar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}button,select,input{font:inherit}button{border:1px solid #aaa;border-radius:7px;padding:8px 12px;background:#fafafa;cursor:pointer}button:hover{background:#e8efff}button:disabled{opacity:.4;cursor:default}.primary{background:#2459b3;color:white;border-color:#2459b3}.primary:hover{background:#164387}.score{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}.muted{color:#666;font-size:13px}.moves{max-height:220px;overflow:auto;border:1px solid #ddd;border-radius:6px;padding:5px}.moves button{padding:5px;margin:2px;font-size:13px}.moves button.current{background:#cfe0ff}#log{white-space:pre-wrap;font-size:12px;max-height:110px;overflow:auto}.settings{display:flex;align-items:center;gap:8px;flex-wrap:wrap}input[type=number]{width:76px;padding:6px}#choices{display:flex;flex-wrap:wrap;gap:5px}#choices button{font-size:13px}.status{min-height:24px;margin:8px 0}canvas{width:100%;height:130px;border:1px solid #ddd} @media(max-width:800px){.layout{grid-template-columns:1fr}body{padding:10px}.piece{font-size:clamp(13px,4vw,22px)}}</style></head><body><main><h1>魔法少女ノ魔法将棋｜局面検討</h1><div class="hint">先手・後手どちらも手動で操作可能。合法手のみ。着手するたび自動解析し、深度を上げながら盤面上の最善手矢印を更新します。ゲーム本体には影響しません。</div><div class="layout"><section class="panel"><div>後手の持ち駒</div><div id="goteHand" class="hand"></div><div class="boardWrap"><div id="board" class="board"></div><svg id="arrowOverlay" class="arrowOverlay" viewBox="0 0 600 600" preserveAspectRatio="none"></svg></div><div>先手の持ち駒</div><div id="senteHand" class="hand"></div><div class="bar"><button id="back">← 戻す</button><button id="forward">進む →</button><button id="initial">初期局面</button><button id="game19">実戦19手目へ</button><button id="flip">盤面反転</button></div><div id="status" class="status"></div><div class="muted">盤上の駒をクリック→移動先をクリック。銃撃・入替・魔女化も選択できます。持ち駒は下のボタンから選択。</div></section><section class="panel"><h2>AI局面評価</h2><div class="settings"><label>深度 <input id="depth" type="number" min="1" max="31" value="19"></label><label>最低深度 <input id="minimum" type="number" min="1" max="31" value="19"></label><label>時間目安(ms) <input id="budget" type="number" min="1" value="1500"></label></div><div class="bar"><button id="analyze" class="primary">再解析</button><button id="playBest">AI最善手を指す</button><button id="stop">解析停止</button></div><div id="score" class="score">—</div><div class="muted">評価値は先手視点（＋先手有利 / −後手有利）</div><div id="info" class="muted"></div><div id="choices"></div><h3>棋譜・分岐</h3><div id="moves" class="moves"></div><h3>評価値の推移</h3><canvas id="chart" width="600" height="130"></canvas><div class="bar"><button id="csv">CSV保存</button></div><details><summary>解析ログ</summary><pre id="log"></pre></details></section></div></main><script type="module" src="/manosaba-analysis-gui.js"></script></body></html>
